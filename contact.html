<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FitSchedule — Контакты</title>

    <link rel="stylesheet" href="./style.css">

</head>

<body>

<header class="header">

    <div class="container nav">

        <a href="./index.html" class="logo">
            Fit<span>Schedule</span>
        </a>

        <nav class="menu">

            <a href="./index.html">Главная</a>
            <a href="./schedule.html">Расписание</a>
            <a href="./sports.html">Спорт</a>
            <a href="./trainers.html">Тренеры</a>
            <a href="./about.html">О нас</a>
            <a href="./contact.html" class="active">Контакты</a>

        </nav>

    </div>

</header>


<main>

<section class="page-header">

    <div class="container">

        <p class="badge">КОНТАКТЫ</p>

        <h1>Свяжись с нами</h1>

        <p>
            Есть вопросы? Напиши нам.
        </p>

    </div>

</section>


<section class="section">

<div class="container contact-grid">

    <div>

        <h2>Контактная информация</h2>

        <div class="contact-item">
            <span>📧</span>
            <div>
                <h3>Email</h3>
                <p>info@fitschedule.com</p>
            </div>
        </div>

        <div class="contact-item">
            <span>📱</span>
            <div>
                <h3>Телефон</h3>
                <p>+998 90 136 06 02</p>
            </div>
        </div>

        <div class="contact-item">
            <span>📍</span>
            <div>
                <h3>Адрес</h3>
                <p>Спортивный центр FitSchedule</p>
            </div>
        </div>

    </div>


    <!-- Форма работает без JavaScript -->
    <form class="contact-form">

        <label for="name">Имя</label>

        <input
            type="text"
            id="name"
            placeholder="Введите имя"
        >


        <label for="email">Email</label>

        <input
            type="email"
            id="email"
            placeholder="Введите email"
        >


        <label for="message">Сообщение</label>

        <textarea
            id="message"
            rows="6"
            placeholder="Ваше сообщение..."
        ></textarea>


        <button type="submit" class="btn btn-primary">
            Отправить сообщение
        </button>

    </form>

</div>

</section>

</main>


<footer class="footer">

    <div class="container footer-content">

        <p>© 2026 FitSchedule</p>

        <a href="./index.html">Главная</a>

    </div>

</footer>

</body>
</html>
